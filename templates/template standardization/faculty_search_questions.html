{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h3>Search Additional Questions for "{{ quiz_name }}"</h3>
  <form action="{{ url_for('faculty.search_add_questions', quiz_name=quiz_name) }}" method="POST" class="mt-3">
    
    <!-- Organ System Selection -->
    <div class="mb-3">
      <label for="organ_system" class="form-label"><strong>Organ System:</strong></label>
      <select name="organ_system" id="organ_system" class="form-control" onchange="updateTopics()">
        <option value="any">-- Any Organ System --</option>
        {% for organ in organ_data.keys() %}
          <option value="{{ organ }}">{{ organ }}</option>
        {% endfor %}
      </select>
    </div>

    <!-- Topic Area Selection (Dynamically populated) -->
    <div class="mb-3">
      <label for="topic_area" class="form-label"><strong>Topic Area:</strong></label>
      <select name="topic_area" id="topic_area" class="form-control">
        <option value="any">-- Any Topic --</option>
      </select>
    </div>

    <!-- Task Area Selection -->
    <div class="mb-3">
      <label for="task_area" class="form-label"><strong>Task Area:</strong></label>
      <select name="task_area" id="task_area" class="form-control">
        <option value="any">-- Any Task Area --</option>
        {% for task in task_areas %}
          <option value="{{ task }}">{{ task }}</option>
        {% endfor %}
      </select>
    </div>

    <!-- Number of Questions Prompt -->
    <div class="mb-3">
      <label for="num_questions" class="form-label"><strong>Number of Additional Questions to Find:</strong></label>
      <input type="number" name="num_questions" id="num_questions" class="form-control" min="1" max="20" value="5" required>
    </div>

    <button type="submit" class="btn btn-success">Search Questions</button>
    <a href="{{ url_for('faculty.review_single', quiz_name=quiz_name) }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>

<script>
  const organData = {{ organ_data | tojson }};
  function updateTopics() {
    const organSelect = document.getElementById('organ_system');
    const topicSelect = document.getElementById('topic_area');
    const selectedOrgan = organSelect.value;

    topicSelect.innerHTML = '<option value="any">-- Any Topic --</option>';
    if (selectedOrgan && organData[selectedOrgan]) {
      organData[selectedOrgan].forEach(topic => {
        const opt = document.createElement('option');
        opt.value = topic;
        opt.textContent = topic;
        topicSelect.appendChild(opt);
      });
    }
  }
</script>
{% endblock %}
