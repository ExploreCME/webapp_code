<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - PANCE Prep</title>
    <!-- Your Clerk script here -->
    <script async crossorigin="anonymous" data-clerk-publishable-key="pk_test_c3BlY2lhbC1kb25rZXktMjguY2xlcmsuYWNjb3VudHMuZGV2JA" src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js" type="text/javascript"></script>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { text-align: center; }
        .logo { color: #48C9B0; font-size: 2em; font-weight: 700; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">PANCE Prep</div>
        <p style="color: #666; margin-bottom: 20px;">Please sign in to access your account.</p>

        <button id="app-sign-in-button" class="btn btn-primary" style="padding: 12px 24px; font-size: 16px; background-color: #008080; color: white; border: none; border-radius: 8px; cursor: pointer;">Sign In</button>
    </div>

    <script>
      window.addEventListener("load", async function () {
        if (window.Clerk) {
            await Clerk.load();
            document.getElementById("app-sign-in-button").addEventListener("click", () => {
                Clerk.redirectToSignIn();
            });
        }
      });
    </script>
</body>
</html>
