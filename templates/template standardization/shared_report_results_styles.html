<style>
    {{ report_scope|default(':root', true)|trim }} {
        --text-dark: #2c3e50;
        --text-muted: #718096;
        --border-color: #edf2f7;
        --bg-light: #f8fafc;
        --primary: #3498db;
        --success: #48C9B0;
        --danger: #e74c3c;
    }
    {{ report_scope|default('') }}.results-wrapper {
        max-width: 600px;
        margin: 40px auto;
        padding: 0 15px;
    }
    {{ report_scope|default('') }}.results-card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        border: 1px solid var(--border-color);
        padding: 40px;
        text-align: center;
    }
    {{ report_scope|default('') }}.results-header {
        margin-bottom: 30px;
    }
    {{ report_scope|default('') }}.results-header h2 {
        color: var(--text-dark);
        font-size: 28px;
        margin: 0 0 10px 0;
    }
    {{ report_scope|default('') }}.results-header p {
        color: var(--text-muted);
        font-size: 1.1em;
        margin: 0;
    }
    {{ report_scope|default('') }}.score-circle {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: var(--bg-light);
        border: 8px solid var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 30px auto;
        flex-direction: column;
    }
    {{ report_scope|default('') }}.score-circle.excellent { border-color: var(--success); }
    {{ report_scope|default('') }}.score-circle.needs-work { border-color: var(--danger); }
    {{ report_scope|default('') }}.score-percentage {
        font-size: 2.5em;
        font-weight: 800;
        color: var(--text-dark);
        line-height: 1;
    }
    {{ report_scope|default('') }}.stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 30px;
        padding-top: 30px;
        border-top: 2px solid var(--border-color);
    }
    {{ report_scope|default('') }}.stat-box {
        padding: 15px;
        border-radius: 12px;
        background: var(--bg-light);
    }
    {{ report_scope|default('') }}.stat-box.correct-box { background: #e6f8f5; color: #22543d; }
    {{ report_scope|default('') }}.stat-box.incorrect-box { background: #fdf2f2; color: #742a2a; }
    {{ report_scope|default('') }}.stat-value {
        font-size: 1.8em;
        font-weight: 700;
        margin-bottom: 5px;
    }
    {{ report_scope|default('') }}.stat-label {
        font-size: 0.9em;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    {% if report_scope|default('') %}
    {{ report_scope }}.results-wrapper, {{ report_scope }}.results-wrapper * {
        box-sizing: content-box;
    }
    {% endif %}
</style>
