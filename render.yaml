services:
  - type: web
    name: explorecme-web
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py display_database:app
    envVars:
      # Web and worker keys must belong to the same OpenAI project.
      - key: OPENAI_API_KEY
        sync: false
      - key: MAX_DOCUMENT_BYTES
        value: "20971520"
      - key: DOCUMENT_TTL_SECONDS
        # Valid range: 3600..2592000 seconds; attached on file creation.
        value: "86400"
      - key: PYTHON_VERSION
        value: 3.11
      - key: FLASK_ENV
        value: production
      - key: FLASK_SECRET_KEY
        sync: false
      - key: PORT
        value: 10000
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DB
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_ISSUER
        value: https://clerk.explorecme.com
      - key: CLERK_JWKS_URL
        value: https://clerk.explorecme.com/.well-known/jwks.json
      - key: SESSION_COOKIE_SAMESITE
        value: None
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: MAINTENANCE_MODE
        value: false
      - key: BYPASS_SECRET
        sync: false
      - key: CACHE_DEFAULT_TIMEOUT
        value: 300
      - key: REDIS_URL
        value: ""
    healthCheckPath: /

  - type: worker
    name: explorecme-worker
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python quiz_worker.py
    envVars:
      - key: MAX_DOCUMENT_BYTES
        value: "20971520"
      - key: DOCUMENT_TTL_SECONDS
        value: "86400"
      # Must belong to the same OpenAI project as the web service key.
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_SSL_DISABLED
        value: "false"
      - key: MYSQL_SSL_CA
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DB
        sync: false
      - key: CLERK_ISSUER
        value: https://clerk.explorecme.com
      - key: CLERK_JWKS_URL
        value: https://clerk.explorecme.com/.well-known/jwks.json
      - key: REDIS_URL
        value: ""
