name: PAXcel guardrail

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

concurrency:
  group: paxcel-guardrail-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  paxcel-guardrail:
    name: PAXcel guardrail (label paxcel-change-approved)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test guardrail script
        run: python -m unittest discover -s tests -p 'test_paxcel_guardrail.py' -v

      - name: Check protected PAXcel paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          git -c core.quotePath=false diff --name-only --no-renames -z \
            "${BASE_SHA}...${HEAD_SHA}" > "${RUNNER_TEMP}/changed_files"
          python scripts/paxcel_guardrail.py < "${RUNNER_TEMP}/changed_files"
